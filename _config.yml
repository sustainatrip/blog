# =====================================
# Configuração do SustainaTrip Blog
# =====================================

# Nome do site
name: SustainaTrip

# Descrição do site
description: Blog sobre turismo sustentável, viagens e experiências pelo mundo.

# Imagem do perfil/logo
avatar: /images/avatar.png


# =====================================
# Redes sociais
# =====================================

footer-links:
  github: sustainatrip
  instagram:
  facebook:
  linkedin:
  youtube:
  email:


# =====================================
# Comentários
# =====================================

disqus:


# =====================================
# Google Analytics
# =====================================

google_analytics:


# =====================================
# GitHub Pages
# =====================================

url: "https://sustainatrip.github.io"
baseurl: "/blog"


# =====================================
# Posts
# =====================================

permalink: /:title/


# =====================================
# Jekyll Now
# =====================================

version: v1.2.0


# =====================================
# Markdown
# =====================================

kramdown:
  input: GFM
  syntax_highlighter: rouge


# =====================================
# CSS
# =====================================

sass:
  style: :expanded


# =====================================
# Plugins GitHub Pages
# =====================================

plugins:
  - jekyll-sitemap
  - jekyll-feed


# =====================================
# Exclusões
# =====================================

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
