# Informações do site
name: SustainaTrip

description: Blog sobre turismo sustentável, viagens e experiências.

avatar: /images/avatar.png

# Redes sociais
footer-links:
  github: sustainatrip
  instagram:
  facebook:
  email:

# Comentários (opcional)
disqus:

# Google Analytics (opcional)
google_analytics:

# Configuração do GitHub Pages
url: https://sustainatrip.github.io
baseurl: "/blog"

# Posts
permalink: /:title/

# Versão do Jekyll Now
version: v1.2.0

# Markdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# CSS
sass:
  style: :expanded

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Arquivos ignorados
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
